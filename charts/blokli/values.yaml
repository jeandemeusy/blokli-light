---
replicaCount: 1

image:
  repository: ghcr.io/jeandemeusy/blokli-light
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []

database:
  url: ""
  existingSecret: ""
  urlKey: BLOKLI_LIGHT_DATABASE_URL
  maxConnections: 5

rpc:
  url: ""
  existingSecret: ""
  urlKey: BLOKLI_LIGHT_RPC_URL
  maxRequestsPerSecond: 0

reader:
  user: blokli_reader
  password: ""
  existingSecret: ""
  passwordKey: BLOKLI_LIGHT_READER_PASSWORD

indexer:
  network: jura-prod
  maxBlockRange: 10000
  confirmations: 3
  topics: known
  pollInterval: 5s
  sourcePollInterval: 30s
  backfillConcurrency: 2

telemetry:
  otlpEndpoint: ""
  otlpSignals: metrics
  metricExportInterval: 15s

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
