apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blokli-light.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "blokli-light.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "blokli-light.name" . }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: blokli-light
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/blokli-light/config.toml"]
          env:
            - name: BLOKLI_LIGHT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "blokli-light.fullname" .) .Values.database.existingSecret }}
                  key: {{ .Values.database.urlKey }}
            - name: BLOKLI_LIGHT_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "blokli-light.fullname" .) .Values.rpc.existingSecret }}
                  key: {{ .Values.rpc.urlKey }}
            {{- if or .Values.reader.password .Values.reader.existingSecret }}
            - name: BLOKLI_LIGHT_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "blokli-light.fullname" .) .Values.reader.existingSecret }}
                  key: {{ .Values.reader.passwordKey }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/blokli-light
              readOnly: true
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "blokli-light.fullname" . }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
