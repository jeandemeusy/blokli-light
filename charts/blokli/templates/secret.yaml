{{- if or (not .Values.database.existingSecret) (not .Values.rpc.existingSecret) (and .Values.reader.password (not .Values.reader.existingSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blokli-light.fullname" . }}
type: Opaque
stringData:
  {{- if not .Values.database.existingSecret }}
  BLOKLI_LIGHT_DATABASE_URL: {{ required "database.url is required" .Values.database.url | quote }}
  {{- end }}
  {{- if not .Values.rpc.existingSecret }}
  BLOKLI_LIGHT_RPC_URL: {{ required "rpc.url is required" .Values.rpc.url | quote }}
  {{- end }}
  {{- if and .Values.reader.password (not .Values.reader.existingSecret) }}
  BLOKLI_LIGHT_READER_PASSWORD: {{ .Values.reader.password | quote }}
  {{- end }}
{{- end }}
