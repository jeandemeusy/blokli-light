apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "blokli-light.fullname" . }}
data:
  config.toml: |
    chain.id = {{ .Values.chain.id }}
    chain.network = {{ .Values.chain.network | quote }}
    rpc_url = "http://environment-override.invalid"
    max_block_range = {{ .Values.indexer.maxBlockRange }}
    max_rpc_requests_per_sec = {{ .Values.rpc.maxRequestsPerSecond }}
    [database]
    url = "postgresql://environment-override.invalid/blokli_light"
    max_connections = {{ .Values.database.maxConnections }}
    [database.reader]
    user = {{ .Values.reader.user | quote }}
    {{ range $name, $source := .Values.sources }}

    [source.{{ $name | quote }}]
    address = {{ $source.address | quote }}
    from_block = {{ $source.fromBlock }}
    {{ with $source.events }}
    events = [{{ range $index, $event := . }}{{ if $index }}, {{ end }}{{ $event | quote }}{{ end }}]
    {{ end }}
    {{ end }}
    [indexer]
    confirmations = {{ .Values.indexer.confirmations }}
    poll_interval = {{ .Values.indexer.pollInterval | quote }}
    source_poll_interval = {{ .Values.indexer.sourcePollInterval | quote }}
    backfill_concurrency = {{ .Values.indexer.backfillConcurrency }}
    [telemetry]
    {{- if .Values.telemetry.otlpEndpoint }}
    otlp_endpoint = {{ .Values.telemetry.otlpEndpoint | quote }}
    {{- end }}
    otlp_signals = {{ .Values.telemetry.otlpSignals | quote }}
    metric_export_interval = {{ .Values.telemetry.metricExportInterval | quote }}
