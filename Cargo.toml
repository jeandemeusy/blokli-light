[workspace]

resolver = "2"

members = ["bloklid"]

[workspace.dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive", "env", "string"] }
hex = "0.4.3"
hopr-bindings = { version = "5.1.0" }
humantime-serde = "1.1.1"
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false }
opentelemetry_sdk = "0.32.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", default-features = false, features = [
  "derive",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring-webpki",
] }
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = [
  "fs",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
  "tracing",
] }
toml = "1.1.2"
tracing = { version = "0.1.44" }
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.8", features = ["serde"] }

[profile.dev]
panic = "abort"

# this profile focuses on the speed of compilation
[profile.candidate]
codegen-units = 16        # normal release default
inherits      = "release"
lto           = false     # do the smallest amount of link-time optimization
opt-level     = 2
panic         = "abort"
strip         = true

# perform minimal optimizations to prevent stack overflows in large tests
[profile.test]
opt-level = 1

# CI keeps line-level backtraces while avoiding large incremental and full
# debug-info artifacts in the Nix binary cache.
[profile.ci-test]
debug       = 1
incremental = false
inherits    = "test"

# this profile focuses on the best runtime performance and the smallest binary size
[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = 3
panic         = "abort"
strip         = true

# Workspace-level lints to prevent common issues
[workspace.lints.clippy]
# Prevent lossy numeric casts that can cause data corruption
cast_possible_truncation = "deny"
cast_possible_wrap       = "deny"
cast_sign_loss           = "deny"
