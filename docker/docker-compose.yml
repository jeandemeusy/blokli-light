---
services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337"]
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: blokli_light
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blokli_light_dev}
      POSTGRES_USER: blokli_light
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blokli_light -d blokli_light"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

  deploy-contracts:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    entrypoint: ["/usr/local/bin/blokli-contract-deployer"]
    command: ["--rpc-url", "http://anvil:8545"]
    depends_on:
      anvil:
        condition: service_healthy

  blokli-light:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    depends_on:
      deploy-contracts:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      BLOKLI_LIGHT_DATABASE_URL: postgresql://blokli_light:${POSTGRES_PASSWORD:-blokli_light_dev}@postgres:5432/blokli_light
      BLOKLI_LIGHT_NETWORK: ${BLOKLI_LIGHT_NETWORK:-anvil-localhost}
      BLOKLI_LIGHT_READER_PASSWORD: ${BLOKLI_LIGHT_READER_PASSWORD:-blokli_reader_dev}
      BLOKLI_LIGHT_RPC_URL: ${BLOKLI_LIGHT_RPC_URL:-http://anvil:8545}
      BLOKLI_LIGHT_LOG_FORMAT: json
      RUST_LOG: ${RUST_LOG:-info}
    restart: unless-stopped

volumes:
  postgres-data:
