[package]
authors     = ["HOPR Association <tech@hoprnet.org>"]
autobins    = false
description = "PostgreSQL raw-log indexer for HOPR and operator-defined contracts"
edition     = "2024"
homepage    = "https://hoprnet.org/"
license     = "GPL-3.0-only"
name        = "blokli-light"
repository  = "https://github.com/jeandemeusy/blokli-light"
version     = "0.1.0"

[lints]
workspace = true

[[bin]]
name = "blokli-light"
path = "src/main.rs"

[[bin]]
name = "blokli-contract-deployer"
path = "src/bin/blokli-contract-deployer.rs"

[dependencies]
alloy-primitives = "1.7.3"
anyhow = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
hopr-bindings = { workspace = true }
humantime-serde = { workspace = true }
opentelemetry = { workspace = true, features = ["logs", "metrics", "trace"] }
opentelemetry-otlp = { workspace = true, features = [
  "grpc-tonic",
  "http-json",
  "http-proto",
  "logs",
  "metrics",
  "reqwest-client",
  "tls-roots",
  "trace",
] }
opentelemetry_sdk = { workspace = true, features = [
  "experimental_logs_batch_log_processor_with_async_runtime",
  "experimental_metrics_periodicreader_with_async_runtime",
  "experimental_trace_batch_span_processor_with_async_runtime",
  "logs",
  "metrics",
  "rt-tokio",
  "trace",
] }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["migrate"] }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[dev-dependencies]
mockito = "1.7.2"
tokio   = { workspace = true, features = ["rt-multi-thread"] }
