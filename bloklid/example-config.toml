# blokli-light example configuration

max_block_range          = 10000
max_rpc_requests_per_sec = 0
network                  = "jura-dev"
rpc_url                  = "https://rpc.gnosischain.com"

# Optional built-in address overrides. Omitted values come from hopr-bindings.
[contracts]
# channels = "0x1234567890123456789012345678901234567890"

# Operator-defined sources are reconciled into PostgreSQL at startup. Removing an
# entry disables its config-managed source; stored logs are never deleted.
# [[sources]]
# name = "my-vault"
# address = "0x1234567890123456789012345678901234567890"
# from_block = 38000000
# events = ["Deposit(address,uint256)", "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"]

[database]
max_connections = 5
url             = "postgresql://blokli_light:password@localhost:5432/blokli_light"

[database.reader]
user = "blokli_reader"
# Password is supplied through BLOKLI_LIGHT_READER_PASSWORD.

[indexer]
# Zero uses the deployment start block from hopr-bindings.
start_block = 0
# "known" preserves Blokli event parity; "all" follows every event emitted by
# built-in addresses. The HOPR token is excluded in both modes.
backfill_concurrency = 2
confirmations        = 3
poll_interval        = "5s"
source_poll_interval = "30s"
topics               = "known"

[telemetry]
# Optional OTLP collector. Supports grpc://, http://, and https:// endpoints.
# otlp_endpoint = "http://localhost:4318"
metric_export_interval = "15s"
otlp_signals           = "metrics"
