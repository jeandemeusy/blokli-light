# HOPR Piz Palu production deployment on Gnosis Chain.
# Replace the database URL and RPC endpoint for the target environment.

max_block_range          = 10000
max_rpc_requests_per_sec = 0
rpc_url                  = "https://rpc.gnosischain.com"

[chain]
id      = 100
network = "piz-palu-prod"

[database]
max_connections = 5
url             = "postgresql://blokli_light:replace-me@localhost:5432/blokli_light_piz_palu_prod"

[database.reader]
user = "blokli_reader"

[indexer]
backfill_concurrency = 2
confirmations        = 3
poll_interval        = "5s"
source_poll_interval = "30s"

[telemetry]
metric_export_interval = "15s"
otlp_signals           = "metrics"

# Omit event filters to retain every event emitted by these HOPR contracts.
